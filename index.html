<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lead Conversion Dashboard</title>
<style>
:root{--or:#E8621C;--or2:#C24D0F;--tint:#FDEDE3;--ink:#231F1E;--mid:#6B625C;--line:#E9E2DA;--card:#fff;--bg:#F6F3EF;--ok:#2E8B57;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F3EEE9;--mid:#B5ADA6;--line:#3A3431;--card:#2A2523;--bg:#1C1918;--tint:#3B2A20}}
:root[data-theme="dark"]{--ink:#F3EEE9;--mid:#B5ADA6;--line:#3A3431;--card:#2A2523;--bg:#1C1918;--tint:#3B2A20}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
.wrap{max-width:1300px;margin:0 auto;padding:18px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font:700 1.45rem Georgia,serif}h1 span{color:var(--or)}
.sub{color:var(--mid);font-size:.8rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:16px}
select,button{font:inherit;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer;font-weight:600}button.p{background:var(--or);border-color:var(--or);color:#fff}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card h2{margin:0 0 12px;font:700 .95rem 'Segoe UI',sans-serif;display:flex;align-items:center;gap:8px}
.card h2::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--or)}
.g{display:grid;gap:14px;margin-bottom:14px}
.k5{grid-template-columns:repeat(5,1fr)}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1.1fr .9fr}
@media(max-width:900px){.k5{grid-template-columns:1fr 1fr}.c2,.c3{grid-template-columns:1fr}}
.kpi .l{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mid)}
.kpi .n{font:700 2rem Georgia,serif;margin:2px 0}
.kpi .s{font-size:.78rem;color:var(--or2);font-weight:600}
.kpi.hero{background:linear-gradient(135deg,var(--or),var(--or2));border:0;color:#fff;display:flex;align-items:center;gap:14px}
.kpi.hero .l,.kpi.hero .s{color:#FFE3D2}
.ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ring i{width:52px;height:52px;border-radius:50%;background:var(--or2);display:grid;place-items:center;font:700 .8rem sans-serif;font-style:normal}
.fn{display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}
.fr .t{height:34px;background:var(--tint);border-radius:9px;overflow:hidden}
.fr .t b{display:flex;align-items:center;height:100%;padding:0 10px;color:#fff;font-size:.8rem;white-space:nowrap;background:linear-gradient(90deg,var(--or),var(--or2));border-radius:9px;min-width:fit-content}
.arrow{margin-left:130px;font-size:.74rem;color:var(--or2);font-weight:600}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.leg{flex:1;min-width:160px;display:grid;gap:5px;font-size:.8rem}
.leg div{display:flex;align-items:center;gap:7px}.leg i{width:10px;height:10px;border-radius:3px;flex-shrink:0}.leg span{margin-left:auto;color:var(--mid)}
.row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row.click{cursor:pointer}.row.click:hover{background:var(--tint)}
.row.on{background:var(--tint)}
.trk{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.trk b{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2))}
.chips{display:flex;gap:6px;font-size:.72rem;color:var(--mid);white-space:nowrap}.chips em{font-style:normal;color:var(--or2);font-weight:700}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mid);padding:6px 8px;border-bottom:2px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.sc{display:flex;height:12px;border-radius:6px;overflow:hidden;min-width:160px;background:var(--line)}.sc i{display:block;height:100%}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--tint);color:var(--or2);font-weight:700;font-size:.75rem}
.scroll{overflow-x:auto}
ul{margin:0;padding-left:18px;color:var(--mid)}li{margin:4px 0}
.empty{color:var(--mid);padding:14px 0}
</style></head><body><div class="wrap">
<header><div><h1>Lead Conversion <span>Dashboard</span></h1><div class="sub" id="stat">Loading…</div></div>
<div class="sub">Source → Manager → Counsellor → Enrollment</div></header>
<div class="bar">
<select id="fS"><option value="">All sources</option></select>
<select id="fM"><option value="">All managers</option></select>
<select id="fC"><option value="">All counsellors</option></select>
<button id="rst">Reset</button><div class="sp"></div>
<button id="live" class="p">Refresh from Sheet</button><button id="smp">Sample data</button>
<input type="file" id="file" accept=".csv" style="max-width:190px">
</div>
<div class="g k5" id="kpis"></div>
<div class="g c3"><div class="card"><h2>Conversion funnel</h2><div class="fn" id="fun"></div></div>
<div class="card"><h2>Lead status mix</h2><div class="donut" id="don"></div></div></div>
<div class="g c2"><div class="card"><h2>Source performance</h2><div id="src"></div></div>
<div class="card"><h2>Manager performance <span class="sub">(click to filter)</span></h2><div id="mgr"></div></div></div>
<div class="card" style="margin-bottom:14px"><h2>Counsellor performance</h2><div class="scroll" id="cns"></div><div class="leg" id="cleg" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:12px"></div></div>
<div class="card"><h2>Insights</h2><ul id="ins"></ul></div>
</div>
<script>
const SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRk9YPasfN1GGUNGuJ_uZY7NwVvTZVX0MIkp17BDzmOGVq5Mx8Vcl7n-64cbBGcZiABBfDEDguWKzvj/pub?output=csv';
const APP='Application Done',PRO='Prospect Stage',ENR='Enrollment'; // funnel stage names (case-insensitive)
const PAL=['#E8621C','#231F1E','#2E8B57','#F2A26B','#4A90A4','#8A817B','#C24D0F','#7A5236','#B5AFA9','#5C6B73','#D98E5C','#F5C6A5'];
let ROWS=[],ST=[];const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b>0?a/b*100:0,fp=p=>p.toFixed(1)+'%';
function csv(t){const R=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
 else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);R.push(r);r=[];f=''}else f+=c}
 if(f!==''||r.length){r.push(f);R.push(r)}return R}
function toRows(t){const R=csv(t);if(R.length<2)return[];const h=R[0].map(x=>x.trim().toLowerCase());
 const ix=n=>h.indexOf(n);const a=ix('source'),b=ix('manager name'),c=ix('counsellor name'),d=ix('status');
 return R.slice(1).map(r=>({source:(r[a]||'').trim(),manager:(r[b]||'').trim(),counsellor:(r[c]||'').trim(),status:(r[d]||'').trim()}))
 .filter(x=>x.source||x.manager||x.counsellor||x.status)
 .map(x=>({source:x.source||'Unknown',manager:x.manager||'Unknown',counsellor:x.counsellor||'Unknown',status:x.status||'Unspecified'}))}
function sample(){let s=5;const rn=n=>(s=(s*9301+49297)%233280)/233280*n|0;const out=[];
 const S=['Google Ads','Facebook','Referral','Website','Walk-in'],M={'Manager A':['Counsellor 1','Counsellor 2','Counsellor 3'],'Manager B':['Counsellor 4','Counsellor 5'],'Manager C':['Counsellor 6','Counsellor 7']};
 const W=[['Application Done',14],['Prospect Stage',9],['Enrollment',5],['Call Back',12],['Not Connected',15],['Not Interested',12],['Drop',8],['Follow-up',10],['Unspecified',15]];
 Object.entries(M).forEach(([m,cs])=>cs.forEach(c=>S.forEach(src=>{const n=25+rn(40);for(let i=0;i<n;i++){let x=rn(100),st='Unspecified';for(const[k,w]of W){if(x<w){st=k;break}x-=w}out.push({source:src,manager:m,counsellor:c,status:st})}})));return out}
const tally=r=>{const m={};r.forEach(x=>m[x.status]=(m[x.status]||0)+1);return m};
const get=(m,n)=>{n=n.toLowerCase();return Object.entries(m).reduce((a,[k,v])=>k.toLowerCase()===n?a+v:a,0)};
const grp=(r,k)=>{const m={};r.forEach(x=>(m[x[k]]=m[x[k]]||[]).push(x));return m};
const col=s=>PAL[ST.indexOf(s)%PAL.length];
function fill(sel,vals,keep){const cur=keep;sel.querySelectorAll('option:not(:first-child)').forEach(o=>o.remove());
 [...new Set(vals)].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o)});sel.value=cur&&[...sel.options].some(o=>o.value===cur)?cur:''}
function seg(m,tot){return '<div class="sc">'+ST.filter(s=>m[s]).map(s=>`<i style="width:${pct(m[s],tot)}%;background:${col(s)}" title="${esc(s)}: ${m[s]} (${fp(pct(m[s],tot))})"></i>`).join('')+'</div>'}
function render(){
 ST=Object.entries(tally(ROWS)).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
 const fS=$('fS'),fM=$('fM'),fC=$('fC'),vs=fS.value,vm=fM.value,vc=fC.value;
 fill(fS,ROWS.map(x=>x.source),vs);fill(fM,ROWS.map(x=>x.manager),vm);
 fill(fC,ROWS.filter(x=>!fM.value||x.manager===fM.value).map(x=>x.counsellor),vc);
 const R=ROWS.filter(x=>(!fS.value||x.source===fS.value)&&(!fM.value||x.manager===fM.value)&&(!fC.value||x.counsellor===fC.value));
 const m=tally(R),T=R.length,a=get(m,APP),p=get(m,PRO),e=get(m,ENR),deg=Math.min(360,pct(e,T)*3.6);
 $('kpis').innerHTML=[['Total leads',T,'in current view'],['Applications',a,fp(pct(a,T))+' of leads'],['Prospects',p,fp(pct(p,T))+' of leads'],['Enrollments',e,fp(pct(e,T))+' of leads']]
  .map(k=>`<div class="card kpi"><div class="l">${k[0]}</div><div class="n">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')+
  `<div class="card kpi hero"><div class="ring" style="background:conic-gradient(#fff ${deg}deg,rgba(255,255,255,.25) 0)"><i>${fp(pct(e,T))}</i></div><div><div class="l">Lead → Enrollment</div><div class="s">${e} of ${T}</div></div></div>`;
 const st=[['Total leads',T],['Application Done',a],['Prospect Stage',p],['Enrollment',e]];
 $('fun').innerHTML=st.map((s,i)=>`<div class="fr"><div class="sub">${s[0]}</div><div class="t"><b style="width:${Math.max(6,pct(s[1],T))}%">${s[1]} · ${fp(pct(s[1],T))}</b></div></div>`+(i<3?`<div class="arrow">↓ ${fp(pct(st[i+1][1],s[1]))} move to next stage</div>`:'')).join('');
 let off=0;const C=2*Math.PI*40;
 const arcs=ST.filter(s=>m[s]).map(s=>{const len=m[s]/T*C,x=`<circle r="40" cx="60" cy="60" fill="none" stroke="${col(s)}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return x}).join('');
 $('don').innerHTML=T?`<svg width="150" height="150" viewBox="0 0 120 120">${arcs}<text x="60" y="58" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">${T}</text><text x="60" y="72" text-anchor="middle" font-size="8" fill="#8A817B">leads</text></svg><div class="leg">${ST.filter(s=>m[s]).map(s=>`<div><i style="background:${col(s)}"></i>${esc(s)}<span>${m[s]} · ${fp(pct(m[s],T))}</span></div>`).join('')}</div>`:'<div class="empty">No data for this filter.</div>';
 const rowsHtml=(g,click)=>{const ks=Object.keys(g).sort((x,y)=>g[y].length-g[x].length),mx=Math.max(1,...ks.map(k=>g[k].length));
  return ks.map(k=>{const t=tally(g[k]),n=g[k].length;return `<div class="row${click?' click':''}${click&&fM.value===k?' on':''}" data-k="${esc(k)}"><div class="nm" title="${esc(k)}">${esc(k)}</div><div><div class="trk"><b style="width:${n/mx*100}%"></b></div><div style="margin-top:5px">${seg(t,n)}</div></div><div class="chips"><span>${n}</span><span>App <em>${fp(pct(get(t,APP),n))}</em></span><span>Pros <em>${fp(pct(get(t,PRO),n))}</em></span><span>Enr <em>${fp(pct(get(t,ENR),n))}</em></span></div></div>`}).join('')||'<div class="empty">No data.</div>'};
 $('src').innerHTML=rowsHtml(grp(R,'source'),false);$('mgr').innerHTML=rowsHtml(grp(R,'manager'),true);
 $('mgr').querySelectorAll('.row').forEach(el=>el.onclick=()=>{fM.value=fM.value===el.dataset.k?'':el.dataset.k;fC.value='';render()});
 const gc=grp(R,'counsellor'),cs=Object.keys(gc).sort((x,y)=>gc[y].length-gc[x].length);
 $('cns').innerHTML='<table><tr><th>Counsellor</th><th>Manager</th><th>Leads</th><th>App %</th><th>Prospect %</th><th>Enrol %</th><th>Status split</th></tr>'+cs.map(k=>{const t=tally(gc[k]),n=gc[k].length;return `<tr><td class="nm">${esc(k)}</td><td>${esc(gc[k][0].manager)}</td><td><b>${n}</b></td><td>${fp(pct(get(t,APP),n))}</td><td>${fp(pct(get(t,PRO),n))}</td><td><span class="pill">${fp(pct(get(t,ENR),n))}</span></td><td>${seg(t,n)}</td></tr>`}).join('')+'</table>';
 $('cleg').innerHTML=ST.map(s=>`<div><i style="background:${col(s)}"></i>${esc(s)}</div>`).join('');
 const ins=[`${T} leads in view; ${fp(pct(a,T))} reached application, ${fp(pct(p,T))} prospect, ${fp(pct(e,T))} enrolled.`,`Application → Prospect: ${fp(pct(p,a))}. Prospect → Enrollment: ${fp(pct(e,p))}.`];
 ST.filter(s=>![APP,PRO,ENR].some(n=>n.toLowerCase()===s.toLowerCase())&&m[s]).forEach(s=>ins.push(`${s}: ${m[s]} leads (${fp(pct(m[s],T))}).`));
 $('ins').innerHTML=ins.map(i=>`<li>${i}</li>`).join('')}
function load(r,msg){ROWS=r;['fS','fM','fC'].forEach(i=>$(i).value='');$('stat').textContent=msg;render()}
async function live(silent){try{const res=await fetch(SHEET_URL+'&_='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);
 const r=toRows(await res.text());if(!r.length){if(!silent)$('stat').textContent='Sheet has no lead rows yet.';return}
 const keep=[$('fS').value,$('fM').value,$('fC').value];ROWS=r;render();$('stat').textContent='Live · '+r.length+' leads · updated '+new Date().toLocaleTimeString()}
 catch(e){if(!silent)$('stat').textContent='Cannot reach Sheet from here (open the downloaded file in your browser). '+e.message}}
['fS','fC'].forEach(i=>$(i).onchange=render);$('fM').onchange=()=>{$('fC').value='';render()};
$('rst').onclick=()=>{['fS','fM','fC'].forEach(i=>$(i).value='');render()};
$('smp').onclick=()=>load(sample(),'Sample data');$('live').onclick=()=>live(false);
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=x=>load(toRows(x.target.result),'Uploaded: '+f.name);rd.readAsText(f)};
load(sample(),'Sample data (connecting to Sheet…)');live(true);setInterval(()=>live(true),60000);
</script></body></html>
